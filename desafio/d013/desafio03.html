<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table {
            border-collapse: collapse;
            width: 600px;
            font-family: Arial, Helvetica, sans-serif;
        
            
        }

        table td {

            border: 1px black solid;
           

        }

        table th {
            border: solid black 1px;

        }

    </style>
</head>
<body>
    <table>
        <tr> 
            <th>Grupo</th>
            <th>Nomes</th>
            <th colspan="3">Filmes</th>
             
        </tr>
        <tr> 
           
            
            
            <th rowspan="3">Mulheres</th>
            <td>Ana Maria Santos</td>
            <td>Alien</td>
            <td>Inception</td>
             <td>Batman</td>
        </tr>
        <tr> 
            
           
            
            <td>Beatriz Souza</td>
            <td>Hulk</td>
            <td>Rambo</td>
            <td>Vingadores</td>

            

        </tr>
        <tr> 
            
            
        
            <td>Claudia Melo</td>
            <td>Oblivion</td>
            <td>Matrix</td>
            <td>Big Hero</td>

        </tr>
        <tr> 
         
            <th rowspan="3">Homens</th>
            <td>Bruno Mendonça</td>
            <td>Intocáveis</td>
            <td>A,mnésia</td>
            <td>Gladiador</td>
  
        </tr>
        <tr> 

            <td>Daniel Lourenço</td>
            <td>Wall-E</td>
            <td>Oldboy</td>
            <td>Dalgal</td>
    

        </tr>
             <tr> 

            <td>Fabiono Mota</td>
            <td>Star Wars 5</td>
            <td>Taxi Driver</td>
            <td>Toy Story</td>
           
        </tr>
    </table>
</body>
</html>
