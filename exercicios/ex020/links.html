<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        } 

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
        color: darkred;
        }

        a:hover {
            color: black;
            text-decoration: underline;

        }

        a::before {
            content: '&rArr';
        }

        a:active {
            color: yellow;
        }

        a::after {
            content: '&rArr';
        }


    </style>

</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/">Canal do Youtube</a></li>

    </ul>
</body>
</html>
