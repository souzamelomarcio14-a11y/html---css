<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>

<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }


    table {
        width: 500px;
        border-collapse: collapse;
    }

    td, th {
        border:  1px solid black;
        padding: 10px;
        
        }

        thead {
             background-color: gray;
             color: white;
        }
</style>
<body>

    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>

        </thead>

        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45 919 049</td>
            </tr>

            <tr>
                <td>Minas gerais</td>
                <td class="num">45 252 666</td>
            </tr>

            <tr>
                <td>Rio de Jane</td>
                <td class="num">17 264 943</td>
            </tr>

            <tr>
                <td> Rio Grande do Sul</td>
                <td class="num">17 264 943</td>
            </tr>

            <tr>
                <td>Goiais</td>
                <td class="num">17 264 943</td>
            </tr>

            <tr>
                <td>Amazonas</td>
                <td class="num">17 264 943</td>
            </tr>

            <tr>
                <td>Bahia</td>
                <td class="num">17 264 943</td>
            </tr>

            <tr>
                <td>Roraima</td>

            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Total de Habitantes</th>
                <td> 210 251 152</td>
            </tr>

        </tfoot>
    </table>
</body>
</html>
